<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Gallery</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Tailwind config (темы/цвета/шрифт) -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#364049",
            "background-light": "#f7f7f7",
            "background-dark": "#17191b",
          },
          fontFamily: {
            display: ["Public Sans", "system-ui", "sans-serif"]
          }
        },
      },
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css"/>

  <!-- App JS -->
  <script src="script.js" defer></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-primary">
<div class="min-h-screen">

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-b border-black/5 dark:border-white/5">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Бренд -->
        <div class="flex items-center gap-3">
          <svg class="h-6 w-6 text-primary" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2zM12 18a6 6 0 1 1 6-6 6.006 6.006 0 0 1-6 6z"></path>
          </svg>
          <h1 class="text-xl font-bold">Photo Gallery</h1>
        </div>

        <!-- Нав / Переключатель темы / Аватар -->
        <div class="flex items-center gap-4">
          <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
            <a class="hover:opacity-75" href="#">Gallery</a>
            <a class="hover:opacity-75" href="#">About</a>
            <a class="hover:opacity-75" href="#">Contact</a>
          </nav>

          <!-- Переключатель темы -->
          <button id="themeToggle" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition" aria-label="Toggle theme">
            <svg id="themeIcon" class="h-5 w-5 text-primary" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <!-- наполнение иконки меняется из JS -->
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
          </button>

          <!-- Аватар -->
          <div class="h-10 w-10 rounded-full bg-cover bg-center ring-1 ring-black/5 dark:ring-white/10"
               style='background-image:url("https://lh3.googleusercontent.com/aida-public/AB6AXuBdIlg8q6ZHxKuyvcjp-b1MG6F0osJw2qjv1pSTTsY8z_F8QIPjn3gewPL4ZtHrmBHaCrkxi46k0fW6R8srmfBW3Lx45hHcvAygN-sn28NlC3HTi6tc00HipBfZYmNe3IiF89LJV1jRtZslKd3AGg9TBpTJ_MvcvJ2f4KVKNIQTRIf7h6v6wGeFkWZlUjhGP6wBJFzMCspvAjRlDxHi21z5h2jl-Nwp1bwsmR-EWDJXDKHkQvcSxoVwIB5ZzSs6WldCB80oVT5Oqw");'>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="pt-16">
    <section class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <!-- Ровная сетка карточек -->
      <div id="gallery" class="gallery-grid"><!-- карточки рендерит script.js --></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="bg-background-light dark:bg-background-dark border-t border-black/5 dark:border-white/5">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-col items-center gap-4">
        <div class="flex gap-6 text-sm">
          <a class="hover:opacity-75" href="#">Instagram</a>
          <a class="hover:opacity-75" href="#">Twitter</a>
          <a class="hover:opacity-75" href="#">Facebook</a>
        </div>
        <p class="text-sm/relaxed opacity-70">© 2024 Photo Gallery. All Rights Reserved.</p>
      </div>
    </div>
  </footer>
</div>

<!-- MODAL (оверлей) -->
<div id="modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" tabindex="-1">
  <!-- Внутренний контейнер (карточка) -->
  <div class="modal-dialog">
    <div class="modal-card">
      <div class="modal-frame">
        <img id="modalImg" src="" alt="Selected photo" class="fade-in">
      </div>
      <div class="photo-caption">
        <p id="modalComment">Комментарий к фото...</p>
        <div class="photo-actions">
          <button class="like-btn" data-id="">
            <img src="icon/like.svg" alt="Like">
            <span>0</span>
          </button>
          <button class="dislike-btn" data-id="">
            <img src="icon/deslike.svg" alt="Dislike">
            <span>0</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ВНЕШНИЕ ЭЛЕМЕНТЫ УПРАВЛЕНИЯ (за пределами карточки) -->
  <button id="prevPhoto" class="modal-nav modal-nav-left" aria-label="Previous photo">◀</button>
  <button id="nextPhoto" class="modal-nav modal-nav-right" aria-label="Next photo">▶</button>
  <button id="closeModal" class="modal-close-outside" aria-label="Close">✕</button>
</div>
</body>
</html>
